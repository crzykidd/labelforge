[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labelforge"
version = "0.1.9"
description = "Self-hosted web app for printing labels to Brother QL series printers"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "crzykidd" }]

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "pillow>=12.3.0",
    "qrcode[pil]>=8.2",
    "python-barcode>=0.16.1",
    "brother-ql-inventree>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.16.8,<0.17",
    "mypy>=2.3.1",
    "types-PyYAML>=6.0.12.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/labelforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff >=0.14 formats Python blocks inside Markdown; docs and archived handoff
# prompts are prose, not source, and must not be rewritten by the formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["brother_ql.*", "qrcode.*", "barcode.*"]
ignore_missing_imports = true
